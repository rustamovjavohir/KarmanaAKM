version: "3.8"


services:
  web:
    restart: always
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    ports:
      - "8000:8000"
    networks:
      - main
    volumes:
      - .:/app
      - static:/app/static/
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: /start

  db:
    restart: always
    image: postgis/postgis:17-3.5-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data/
    networks:
      - main
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


volumes:
  pg_data:
  static:

networks:
  main: { }
